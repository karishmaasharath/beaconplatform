<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>BEACON – Check In</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Noto+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <style>
    body { font-family: Manrope, "Noto Sans", sans-serif; }

    input[type="range"] {
      appearance: none; -webkit-appearance: none;
      width: 100%; height: 8px; border-radius: 9999px;
      background: linear-gradient(to right, #d1d1f9 50%, #cfdae7 50%);
      transition: background .3s;
    }

    input[type="range"]::-webkit-slider-thumb,
    input[type="range"]::-moz-range-thumb {
      appearance: none; -webkit-appearance: none;
      width: 18px; height: 18px; border: none; cursor: pointer;
      border-radius: 9999px; background: #d1d1f9; margin-top: -5px;
    }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0; }
      40% { opacity: 1; }
    }
    .typing-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 2px;
      background-color: #0e0e1b; 
      border-radius: 50%;
      animation: blink 1.4s infinite both;
    }
    .typing-dots span:nth-child(1) { animation-delay: 0s; }
    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  </style>
</head>
<body class="bg-[#f8f8fb] text-[#0e0e1b]">
  <header class="flex items-center justify-between border-b border-[#e8e8f3] px-10 py-4">
    <div class="flex items-center gap-6">
      <div class="w-8 h-8">
        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" class="w-full h-full">
          <path d="M12 20s8-4 8-10a8 8 0 1 0-16 0c0 6 8 10 8 10z"/><path d="M9 9h.01M15 9h.01"/>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight">BEACON</h1>
    </div>
    <nav class="flex gap-6 text-lg font-light">
      <a href="home.html">home</a>
      <a href="checkin.html" class="font-semibold">check&nbsp;in</a>
      <a href="garden.html">my&nbsp;garden</a>
      <a href="#">forum</a>
      <a href="tips.html">tips</a>
      <a href="help.html">help</a>
      <a href="profile.html">profile</a>
      <button class="bg-[#e8e8f3] px-4 py-1 rounded-full text-sm">register</button>
      <button id="logoutBtn" class="hidden px-4 py-1 text-sm lowercase">log&nbsp;out</button>
    </nav>
  </header>

  <!-- main -->
<main class="px-6 py-10 flex justify-center">
  <div class="flex flex-col w-full max-w-xl py-5">
    <!-- Title -->
    <h2 class="text-3xl font-extrabold text-center pb-6">Check In</h2>

    <!-- Mood Slider -->
    <div class="px-4 py-4 bg-white rounded-lg shadow-inner border border-[#cfdae7] mb-4">
      <label class="block text-base font-medium mb-2">
        Rate how you feel (0 = worst, 10 = best):
      </label>
      <div class="flex items-center gap-4">
        <input id="moodSlider" type="range" min="0" max="10" value="5"
               oninput="updateSlider()" class="w-full cursor-pointer">
        <span id="moodValue" class="text-sm font-semibold">5</span>
      </div>
      <p id="moodPhrase" class="mt-2 text-lg font-medium text-[#4f4f96]">I'm feeling okay</p>
    </div>

    <!-- Free-Text Input -->
<div class="flex items-center px-4 py-3 bg-white rounded-lg shadow-inner border border-[#cfdae7]">
  <input 
    id="userInput"
    type="text"
    placeholder="Type a message…" 
    class="flex-1 rounded-lg border border-[#cfdae7] bg-[#f8f8fb] px-4 py-2 placeholder:text-[#4c709a] focus:border-[#d1d1f9] focus:outline-none"
  />
  <button 
  id="sendButton"
  class="ml-3 px-6 h-10 rounded-full bg-[#d1d1f9] text-sm font-bold hover:bg-[#bcbcf3] transition-colors"
>
  Send
</button>

</div>

    <!-- Chat Messages -->
    <div id="chatContainer" 
         class="px-4 py-4 flex flex-col gap-3 max-h-64 overflow-y-auto bg-white rounded-lg shadow-inner border border-[#cfdae7] mb-4">
      <!-- Messages will be appended here dynamically -->
    </div>

    <div class="flex gap-3 mb-4 justify-center">
      <button id="downloadJsonBtn" class="px-4 py-2 rounded-full bg-white border">Download JSON</button>
      <button id="downloadTxtBtn" class="px-4 py-2 rounded-full bg-white border">Download TXT</button>
      <button id="clearChatBtn" class="px-4 py-2 rounded-full bg-white border">Clear chat</button>
    </div>

    <!-- Submit Button -->
    <div class="px-4 py-3 flex justify-center">
      <button onclick="submitMood()"
              class="px-6 h-10 rounded-full bg-[#d1d1f9] text-sm font-bold">Submit</button>
    </div>
  </div>
</main>

  <!-- logic -->
  <script>
    const slider = document.getElementById('moodSlider');
    const valueEl = document.getElementById('moodValue');
    const moodPhrase = document.getElementById('moodPhrase');
    const chatContainer = document.getElementById('chatContainer');
    const sendButton = document.getElementById('sendButton');

    function updateSlider() {
      const value = Number(slider.value);
      valueEl.textContent = value;
      const pct = value * 10;
      slider.style.background = `linear-gradient(to right, #d1d1f9 ${pct}%, #cfdae7 ${pct}%)`;
      moodPhrase.textContent =
         value <= 2 ? "I'm not feeling great" :
         value <= 4 ? "I'm feeling low" :
         value <= 6 ? "I'm feeling okay" :
         value <= 8 ? "I'm feeling good" :
                      "I'm feeling happy!";
    }
    function getUserEmail() {
      return localStorage.getItem('beacon_user_email') || 'guest';
    }

    function chatsKeyFor(email) {
      return `beacon_chats:${email}`;
    }

    function loadChat() {
      const email = getUserEmail();
      const raw = localStorage.getItem(chatsKeyFor(email));
      if (!raw) return [];
      try {
        const arr = JSON.parse(raw);
        arr.forEach(msg => appendMessageToDOM(msg.sender, msg.text, false));
        // scroll to bottom
        chatContainer.scrollTop = chatContainer.scrollHeight;
        return arr;
      } catch (e) {
        console.error('Failed to parse chat history', e);
        return [];
      }
    }

    function saveChatArray(arr) {
      const email = getUserEmail();
      localStorage.setItem(chatsKeyFor(email), JSON.stringify(arr));
    }

    function getChatArray() {
      const email = getUserEmail();
      const raw = localStorage.getItem(chatsKeyFor(email));
      return raw ? JSON.parse(raw) : [];
    }

    function pushAndSaveMessage(sender, text) {
      const arr = getChatArray();
      arr.push({ sender, text, ts: new Date().toISOString() });
      saveChatArray(arr);
    }

   
    function appendMessageToDOM(sender, text, save = true) {
      const el = document.createElement('div');
      if (sender === 'user') {
        el.className = "self-end bg-[#d1d1f9] text-[#0e0e1b] px-4 py-2 rounded-lg max-w-[80%] break-words";
      } else {
        el.className = "self-start bg-gray-100 text-[#0e0e1b] px-4 py-2 rounded-lg max-w-[80%] whitespace-pre-wrap break-words";
      }
      el.textContent = text;
      chatContainer.appendChild(el);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      if (save) pushAndSaveMessage(sender, text);
      return el;
    }

    async function sendMessage() {
      const userInputEl = document.getElementById("userInput");
      const userInput = userInputEl.value.trim();
      if (!userInput) return;

      
      appendMessageToDOM('user', userInput, true);
      userInputEl.value = "";

      
      const typingIndicator = document.createElement("div");
      typingIndicator.className = "self-start bg-gray-100 text-[#0e0e1b] px-4 py-2 rounded-lg max-w-[20%] flex justify-center typing-dots";
      typingIndicator.innerHTML = `<span></span><span></span><span></span>`;
      chatContainer.appendChild(typingIndicator);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      
      const payload = { text: userInput, user_id: getUserEmail() };

      try {
        const response = await fetch("http://localhost:3000/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const result = await response.json();
        const reply = result.reply || "Hmm… I’m not sure what to say.";

        typingIndicator.remove();

        // create bot message element and animate typing
        const botMsg = document.createElement("div");
        botMsg.className = "self-start bg-gray-100 text-[#0e0e1b] px-4 py-2 rounded-lg max-w-[80%] whitespace-pre-wrap";
        chatContainer.appendChild(botMsg);

        let i = 0;
        function typeChar() {
          if (i < reply.length) {
            botMsg.textContent += reply.charAt(i);
            i++;
            setTimeout(typeChar, 40);
            chatContainer.scrollTop = chatContainer.scrollHeight;
          } else {
            // finished typing — save it
            pushAndSaveMessage('bot', reply);
          }
        }
        typeChar();
      } catch (err) {
        typingIndicator.remove();
        const errorMsg = document.createElement("div");
        errorMsg.className = "self-start bg-red-100 text-red-700 px-4 py-2 rounded-lg max-w-[80%]";
        errorMsg.textContent = "Oops! Could not reach backend.";
        chatContainer.appendChild(errorMsg);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        // Save error as bot message optionally
        pushAndSaveMessage('bot', 'Error: backend unreachable');
      }
    }

    // ----------------- Save/Download/Clear UI actions -----------------
    function downloadJSON() {
      const arr = getChatArray();
      const blob = new Blob([JSON.stringify(arr, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const email = getUserEmail().replace(/[^a-z0-9_\-@.]/gi, '_');
      a.download = `beacon-chat-${email}-${new Date().toISOString().slice(0,19)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function downloadTXT() {
      const arr = getChatArray();
      const lines = arr.map(m => `${m.ts} — ${m.sender.toUpperCase()}: ${m.text}`);
      const blob = new Blob([lines.join('\n\n')], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      const email = getUserEmail().replace(/[^a-z0-9_\-@.]/gi, '_');
      a.download = `beacon-chat-${email}-${new Date().toISOString().slice(0,19)}.txt`;
      document.body.appendChild(a);
      a.click();
      a.remove();
    }

    function clearChat() {
      if (!confirm('Clear the chat history for this account? This cannot be undone.')) return;
      const email = getUserEmail();
      localStorage.removeItem(chatsKeyFor(email));
      chatContainer.innerHTML = '';
    }

    // ----------------- Submit mood (unchanged logic + local save) -----------------
    function submitMood() {
      const todayKey = new Date().toISOString().slice(0, 10);
      const mood = Number(slider.value);
      const moodLog = JSON.parse(localStorage.getItem('moodLog') || '{}');

      // Save mood locally
      moodLog[`mood-${todayKey}`] = mood;
      localStorage.setItem('moodLog', JSON.stringify(moodLog));

      let plant = Number(localStorage.getItem('plantLevel')) || 0;
      if (plant < 29) localStorage.setItem('plantLevel', plant + 1);

      // Show toast
      const toast = document.getElementById("checkinToast");
      const toastMsg = document.getElementById("checkinToastMessage");
      toastMsg.textContent = "Mood submitted!";
      toast.classList.remove("hidden");
      setTimeout(() => toast.classList.add("hidden"), 3000);
    }

    // ----------------- event wiring -----------------
    document.getElementById("sendButton").addEventListener("click", () => sendMessage());
    document.getElementById("userInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById("downloadJsonBtn").addEventListener("click", downloadJSON);
    document.getElementById("downloadTxtBtn").addEventListener("click", downloadTXT);
    document.getElementById("clearChatBtn").addEventListener("click", clearChat);

    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.removeItem("beacon_user_email");
      window.location.href = "home.html";
    });

    // ----------------- Load saved chat on startup -----------------
    window.addEventListener("DOMContentLoaded", () => {
      // Reveal logout if user present
      const email = localStorage.getItem('beacon_user_email');
      if (email) {
        document.getElementById('logoutBtn').classList.remove('hidden');
      }

      loadChat();
    });

  </script>

<!-- Toast -->
<div
  id="checkinToast"
  class="fixed top-6 left-1/2 -translate-x-1/2 transform bg-[#d1d1f9] text-[#0e0e1b] text-sm font-medium px-6 py-3 rounded-xl shadow-xl hidden z-50 transition-all duration-300 ease-in-out"
>
  <span id="checkinToastMessage">Mood submitted!</span>
</div>

</body>
</html>
