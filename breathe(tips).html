<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEACON – Breathe</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Noto+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <style>
    body {
      font-family: Manrope, "Noto Sans", sans-serif;
    }

    @keyframes breathe {
      0%, 100% {
        transform: scale(1);
        opacity: 0.8;
      }
      50% {
        transform: scale(1.4);
        opacity: 1;
      }
    }

    .breathe-animation {
      animation: breathe 8s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#f8f8fb] text-[#0e0e1b] min-h-screen flex flex-col">
  <!-- Header -->
  <header class="flex items-center justify-between border-b border-[#e8e8f3] px-10 py-4">
    <div class="flex items-center gap-4">
      <div class="w-8 h-8">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" class="w-full h-full">
          <path d="M12 20s8-4 8-10a8 8 0 1 0-16 0c0 6 8 10 8 10z"/>
          <path d="M9 9h.01M15 9h.01"/>
        </svg>
      </div>
      <h1 class="text-3xl font-extrabold tracking-tight">BEACON</h1>
    </div>
    <nav class="flex gap-6 text-lg font-light">
      <a href="home.html">home</a>
      <a href="checkin.html">check in</a>
      <a href="garden.html">my garden</a>
      <a href="#">forum</a>
      <a href="tips.html" class="font-semibold"> tips</a>
      <a href="help.html">help</a>
      <a href="profile.html">profile</a>
      <button onclick="openAuthPopup()" class="bg-[#e8e8f3] px-4 py-1 rounded-full text-sm">register</button>
      <button id="logoutBtn" class="hidden px-4 py-1 text-sm lowercase text-[#0e0e1b]">log out</button>
    </nav>
  </header>

  <!-- Main (Breathe Feature) -->
  <main class="flex-1 flex flex-col items-center justify-center px-6 py-10">
    <div class="w-full max-w-2xl text-center">
      <h2 class="text-4xl font-extrabold mb-6">Breathe Together</h2>
      <p class="text-[#4f4f96] text-lg mb-8">
        Follow the expanding and contracting circle to guide your breathing.
      </p>

      <!-- Circle -->
      <div class="flex justify-center mb-8">
        <div id="breatheCircle" class="w-32 h-32 bg-[#d1d1f9] rounded-full transition-transform duration-1000 ease-in-out"></div>
      </div>

      <!-- Buttons -->
      <div class="flex flex-col items-center space-y-4">
        <div class="flex space-x-4">
          <button onclick="startBreathe()"
                  class="bg-[#d1d1f9] text-[#0e0e1b] font-bold px-6 py-3 rounded-full text-sm">
            Start
          </button>
          <button onclick="stopBreathe()"
                  class="bg-[#f2f2f2] text-[#0e0e1b] font-medium px-6 py-3 rounded-full text-sm">
            Stop
          </button>
        </div>

        <button onclick="window.location.href='tips.html'"
                class="underline text-sm text-[#4f4f96] hover:text-[#2e2e80]">
          Go back to tips page
        </button>
      </div>

      <p class="text-[#4f4f96] text-xs mt-6">
        This feature is for educational purposes and does not replace professional medical advice.
      </p>
    </div>
  </main>

  <!-- Auth popup -->
  <div id="authPopup" class="fixed inset-0 hidden bg-black bg-opacity-50 z-50 flex items-center justify-center">
    <div class="relative bg-white shadow-xl rounded-xl p-8 max-w-sm w-full text-center">
      <button onclick="closePopup()" class="absolute top-2 right-2 text-[#0e0e1b] text-xl">&times;</button>
      <h2 class="text-2xl font-bold mb-6">Welcome to BEACON</h2>
    </div>
  </div>

  <script>
    function openAuthPopup() {
      document.getElementById('authPopup').classList.remove('hidden');
    }

    function closePopup() {
      document.getElementById('authPopup').classList.add('hidden');
    }

    let isBreathing = false;

    function startBreathe() {
      const circle = document.getElementById("breatheCircle");
      if (!isBreathing) {
        circle.classList.add("breathe-animation");
        isBreathing = true;
      }
    }

    function stopBreathe() {
      const circle = document.getElementById("breatheCircle");
      circle.classList.remove("breathe-animation");
      isBreathing = false;
    }
  </script>
</body>
</html>
